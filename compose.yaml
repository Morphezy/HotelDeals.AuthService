services:
  authservice:
    image: authservice
    build:
      context: .
      dockerfile: Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AuthDb: Host=auth-db;Port=5432;Database=auth;Username=auth;Password=auth
      JwtKey: ${JWT_KEY:-DevJwtKey1234567890DevJwtKey123456}
      JwtIssuer: ${JWT_ISSUER:-AuthService}
      JwtAudience: ${JWT_AUDIENCE:-AuthClient}
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    image: hoteldeals-front
    build:
      context: ../../Desktop/HotelDeals.Front
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

  telegram-service:
    image: telegrambotservice
    build:
      context: ../TelegramBotService
      
      dockerfile: TelegramBotService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in your shell or .env}
      DefaultConnection: Host=telegram-db;Port=5432;Database=telegram;Username=telegram;Password=telegram
      ExternalService__BaseUrl: http://authservice:8080
    depends_on:
      telegram-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  search-service:
    image: search-service
    build:
      context: ../Services/SearchService
      dockerfile: SearchService.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=search-db;Port=5432;Database=searchdb;Username=postgres;Password=postgres
    depends_on:
      - search-db
    ports:
      - "8082:8080"

  auth-db:
    image: postgres:16
    container_name: authservice-postgres
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

  telegram-db:
    image: postgres:16-alpine
    container_name: telegrambot-postgres
    environment:
      POSTGRES_DB: telegram
      POSTGRES_USER: telegram
      POSTGRES_PASSWORD: telegram
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram -d telegram"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - telegram-postgres-data:/var/lib/postgresql/data

  search-db:
    image: postgres:16
    container_name: searchservice-postgres
    environment:
      POSTGRES_DB: searchdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - searchservice-db:/var/lib/postgresql/data

volumes:
  auth-postgres-data:
  telegram-postgres-data:
  searchservice-db:

services:
  web:
    image: web
    build:
      context: .
      dockerfile: Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__AuthDb=Host=postgres;Port=5432;Database=auth;Username=auth;Password=auth
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  web-1:
    image: web-1
    build:
      context: .
      dockerfile: Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__AuthDb=Host=postgres;Port=5432;Database=auth;Username=auth;Password=auth
    depends_on:
      - postgres
    ports:
      - "8082:8080"

  web-2:
    image: web-2
    build:
      context: .
      dockerfile: Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__AuthDb=Host=postgres;Port=5432;Database=auth;Username=auth;Password=auth
    depends_on:
      - postgres
    ports:
      - "8083:8080"

  postgres:
    image: postgres:16
    container_name: authservice-postgres
    environment:
      - POSTGRES_DB=auth
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=auth
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

